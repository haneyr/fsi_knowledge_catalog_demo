# Website deployment pipeline.
# Trigger: push to main, file filter: website-live/**
# Reads agent IDs from Secret Manager and deploys the Cloud Run website.

substitutions:
  _ENV: "dev"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # ── Step 1: Resolve target project ──────────────────────────────────────
  - id: resolve-project
    name: google/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        TFVARS="env/${_ENV}.tfvars"
        PROJECT_ID=$$(grep -E '^\s*project_id' "$$TFVARS" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
        echo "$$PROJECT_ID" > /workspace/project_id.txt
        echo "Target project: $$PROJECT_ID"

  # ── Step 2: Read secrets ────────────────────────────────────────────────
  - id: read-secrets
    name: google/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        PROJECT_ID=$$(cat /workspace/project_id.txt)
        for secret in basic-agent-id scaled-agent-id kc-agent-id oauth-client-id; do
          VALUE=$$(gcloud secrets versions access latest --secret="$$secret" --project="$$PROJECT_ID")
          echo "$$VALUE" > "/workspace/$${secret}.txt"
          echo "  $$secret = $$VALUE"
        done

  # ── Step 3: Deploy website ─────────────────────────────────────────────
  - id: deploy-website
    name: google/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        export GOOGLE_CLOUD_PROJECT=$$(cat /workspace/project_id.txt)
        export GOOGLE_CLOUD_LOCATION=us-central1
        export BASIC_AGENT_ID=$$(cat /workspace/basic-agent-id.txt)
        export SCALED_AGENT_ID=$$(cat /workspace/scaled-agent-id.txt)
        export KC_AGENT_ID=$$(cat /workspace/kc-agent-id.txt)
        export OAUTH_CLIENT_ID=$$(cat /workspace/oauth-client-id.txt)
        export ENVIRONMENT_LABEL=${_ENV}
        export SNOWFLAKE_ACCOUNT=$$(gcloud secrets versions access latest --secret=snowflake-account --project="$$GOOGLE_CLOUD_PROJECT" 2>/dev/null || true)
        bash website-live/deploy.sh

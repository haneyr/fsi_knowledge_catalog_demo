# Terraform infrastructure pipeline.
# Two triggers use this file (both in the CI hub project):
#   - PR to main  → _ACTION=plan  → runs plan, posts diff as PR comment
#   - push to main → _ACTION=apply → applies to the dev environment
#
# Substitutions (set by the trigger):
#   _ACTION: "plan" or "apply"
#   _ENV:    "dev" or "prod" (selects env/<_ENV>.tfvars)
#   _PR_NUMBER: PR number (plan mode only, for posting comments)
#   _GITHUB_OWNER: GitHub org/user (e.g. "haneyr")
#   _GITHUB_REPO: GitHub repo name (e.g. "fsi_knowledge_catalog_demo")

substitutions:
  _ACTION: "plan"
  _ENV: "dev"
  _PR_NUMBER: ""
  _GITHUB_OWNER: ""
  _GITHUB_REPO: ""

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # ── Step 1: Install Terragrunt ──────────────────────────────────────────
  - id: install-terragrunt
    name: gcr.io/cloud-builders/curl
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        TG_VERSION="0.77.22"
        curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/v$${TG_VERSION}/terragrunt_linux_amd64" \
          -o /workspace/terragrunt
        chmod +x /workspace/terragrunt

  # ── Step 2: Run terragrunt plan or apply ────────────────────────────────
  - id: terragrunt
    name: hashicorp/terraform:1.12
    entrypoint: bash
    env:
      - ENVIRONMENT=${_ENV}
      - TF_IN_AUTOMATION=1
    args:
      - -c
      - |
        set -euo pipefail
        export PATH="/workspace:$$PATH"

        cd stacks

        if [ "${_ACTION}" = "plan" ]; then
          echo "=== Terragrunt plan (ENVIRONMENT=${_ENV}) ==="
          terragrunt run --all plan --non-interactive \
            -no-color 2>&1 | tee /workspace/plan-output.txt
        elif [ "${_ACTION}" = "apply" ]; then
          echo "=== Terragrunt apply (ENVIRONMENT=${_ENV}) ==="
          terragrunt run --all apply -auto-approve --non-interactive \
            -no-color
        else
          echo "ERROR: _ACTION must be 'plan' or 'apply', got '${_ACTION}'"
          exit 1
        fi

  # ── Step 3: Post plan as PR comment (plan mode only) ────────────────────
  - id: post-plan-comment
    name: gcr.io/cloud-builders/curl
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        # Skip if not a plan, or no PR number provided.
        if [ "${_ACTION}" != "plan" ] || [ -z "${_PR_NUMBER}" ]; then
          echo "Skipping PR comment (action=${_ACTION}, pr=${_PR_NUMBER})"
          exit 0
        fi

        # Truncate plan output to fit GitHub comment size limit (~64KB).
        PLAN=$(head -c 60000 /workspace/plan-output.txt)
        BODY=$(cat <<COMMENT_EOF
        <details><summary>Terraform Plan (<code>${_ENV}</code>)</summary>

        \`\`\`
        $${PLAN}
        \`\`\`

        </details>
        COMMENT_EOF
        )

        # Post as a PR comment using the GitHub API.
        # The Cloud Build trigger must have GITHUB_TOKEN available as a secret.
        curl -s -X POST \
          -H "Authorization: token $${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${_GITHUB_OWNER}/${_GITHUB_REPO}/issues/${_PR_NUMBER}/comments" \
          -d "$(jq -n --arg body "$$BODY" '{body: $body}')"

        echo "Posted plan comment to PR #${_PR_NUMBER}"
    secretEnv: ['GITHUB_TOKEN']

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/github-token/versions/latest
      env: GITHUB_TOKEN

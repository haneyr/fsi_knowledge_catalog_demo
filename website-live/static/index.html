<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northwind Retail Group — Knowledge Catalog Agent Demo (Live)</title>
  <link rel="stylesheet" href="/styles.css?v=7">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="agent-basic">

  <div id="loginScreen" class="login-screen hidden">
    <div class="login-card">
      <div class="login-logo">Northwind <span>Retail Group</span></div>
      <p class="login-subtitle">Knowledge Catalog Agent Demo</p>
      <div id="gsiButtonContainer"></div>
    </div>
  </div>

  <header class="app-header">
    <div class="logo">Northwind <span>Retail Group</span></div>
    <div class="agent-tabs">
      <button class="agent-tab active" data-agent="basic" onclick="switchAgent('basic')">Basic Agent</button>
      <button class="agent-tab" data-agent="scaled" onclick="switchAgent('scaled')">Scaled Agent</button>
      <button class="agent-tab" data-agent="kc" onclick="switchAgent('kc')">KC Agent</button>
    </div>
    <span id="envBadge" class="env-badge hidden"></span>
    <div class="user-profile hidden" id="userProfile">
      <img id="userAvatar" class="user-avatar" src="" alt="">
      <span id="userName" class="user-name"></span>
      <button class="sign-out-btn" onclick="signOut()">Sign out</button>
    </div>
  </header>

  <div class="main-container">
    <div class="viz-panel">
      <canvas id="vizCanvas"></canvas>
      <div class="viz-info" id="vizInfo">
        <h3 id="vizTitle">Basic Agent</h3>
        <p id="vizDesc">5 gold tables hardcoded in the prompt. Works for simple questions within its narrow scope.</p>
      </div>
      <div class="viz-legend" id="vizLegend"></div>
    </div>

    <div class="resize-handle" id="resizeHandle"></div>
    <div class="chat-panel" id="chatPanel">
      <div class="chat-header" id="chatHeader">
        <span>Chat with Basic Agent</span>
        <button class="new-session-btn" id="newSessionBtn" title="Start a new conversation">New Session</button>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="typing-indicator" id="typingIndicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
      <div class="chat-input-area">
        <div class="narrative-tabs" id="narrativeTabs"></div>
        <div class="preset-questions" id="presetQuestions"></div>
        <div class="input-row">
          <input type="text" id="chatInput" placeholder="Ask a question..." autocomplete="off">
          <button class="send-btn" id="sendBtn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <div id="tablePopup" class="table-popup hidden">
    <div class="popup-header">
      <span class="popup-tier"></span>
      <span class="popup-name"></span>
      <button class="popup-close" onclick="document.getElementById('tablePopup').classList.add('hidden')">&times;</button>
    </div>
    <div class="popup-body">
      <p class="popup-desc"></p>
      <div class="popup-cols"></div>
    </div>
    <a class="popup-link" target="_blank" rel="noopener">Open in Knowledge Catalog &rarr;</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/visualization.js?v=11"></script>
  <script src="/chat.js?v=11"></script>
  <script>
    // _snowflakeEnabled is declared in chat.js — reuse it here
    let _snowflakeLive = false;
    let currentAgentMode = 'basic';
    let _lastConfig = null;

    const NARRATIVES = {
      merchandising: {
        label: 'MERCHANDISING & INVENTORY',
        desc: 'Merchandising Manager & Supply Chain Planner — assortment margin, markdown VaR, GTIN quality, governed markdown planning.',
        steps: [
          { cat: 'Assortment Margin', q: 'Which of our merchandise assortments have delivered the highest YTD return and total market value?' },
          { cat: 'Markdown Exposure', q: 'For active merchandise assortments, which GTIN-13 SKUs carry the largest unrealized inventory loss, who is the assigned category manager, and how does their sector\'s 1-day 99% Markdown Value at Risk compare?' },
          { cat: 'Certification & GTIN DQ', q: 'Which assortment and product SKU tables are certified in Knowledge Catalog, who owns them, and can we trust the GTIN-13 identifiers in silver_product_skus?' },
          { cat: 'Governed Markdown Plan', q: 'Build a markdown recovery plan for our underperforming assortments using only governed, certified data free of payment card scope, and quantify the working capital impact.' },
        ],
      },
      customer: {
        label: 'CUSTOMER & LOYALTY',
        desc: 'Loyalty/CRM Marketer & Store Ops Director — loyalty tiers, omnichannel revenue, customer lineage, consent-governed return abuse.',
        steps: [
          { cat: 'Loyalty Tiers', q: 'How many active customers and what total relationship value do we have across each customer loyalty segment?' },
          { cat: 'Omnichannel Revenue', q: 'Across our active VIP loyalty tiers, how does Customer Lifetime Value (CLV) and e-commerce order volume compare against active BNPL balances and average Return-Risk Score by primary store region?' },
          { cat: 'Customer Lineage', q: 'Where does our customer and loyalty data originate, how does it flow from source systems to gold_customer_360, and who is the data steward?' },
          { cat: 'Consent & Return Abuse', q: 'Identify VIP or high-risk customers whose return and promo activity flags abuse risk, showing only their marketing consent verification status and high-value refunds.' },
        ],
      },
      privacy: {
        label: 'PRIVACY & COMPLIANCE',
        desc: 'Privacy & Compliance Officer — BNPL risk tiers, vintage delinquency, PCI/CCPA classification, dashboard lineage & audit.',
        steps: [
          { cat: 'BNPL Risk Tiers', q: 'Give me a breakdown of our BNPL plans by plan type, risk rating, and average Return-Risk score.' },
          { cat: 'Vintage Delinquency', q: 'Are BNPL delinquencies trending up or down across origination vintages, and which segments have the highest 90+ day delinquency rate?' },
          { cat: 'PCI & PII Scope', q: 'Which tables contain PCI-DSS payment card data or CCPA-regulated PII in Knowledge Catalog, and what are their data classification and access control levels?' },
          { cat: 'Dashboard Lineage & Audit', q: 'Which payment-card or personal-data fields flow into our executive compliance dashboards, which source systems do they originate from, and are all regulatory filing schedules on track?' },
        ],
      },
      multicloud: {
        label: 'CROSS-CLOUD',
        desc: 'NEXUS — Syndicated Retail Market Intelligence (Snowflake) governed in Knowledge Catalog alongside BigQuery.',
        steps: [
          { cat: 'Benchmarks', q: 'How do our top categories compare to NEXUS market benchmarks? Where are we losing share?' },
          { cat: 'Price Gaps', q: 'Which of our SKUs are priced above competitors right now, and what is that costing us in units?' },
          { cat: 'Demand', q: 'Are there regions where NEXUS demand indices are rising but our sales are flat?' },
          { cat: 'Basket', q: 'What do NEXUS basket affinity patterns suggest we should be cross-merchandising that we currently are not?' },
        ],
      },
    };

    let activeNarrative = 'merchandising';

    const AGENT_INFO = {
      basic: {
        title: 'Basic Agent',
        desc: '5 gold tables hardcoded in the prompt. Works for simple questions within its narrow scope.',
        header: 'Chat with Basic Agent',
      },
      scaled: {
        title: 'Scaled Agent',
        desc: '128 tables discovered dynamically. No Knowledge Catalog. Overwhelmed by ambiguity — picks wrong tables, misses cross-domain data.',
        header: 'Chat with Scaled Agent',
      },
      kc: {
        title: 'KC-Guided Agent',
        desc: '128 BigQuery tables + 6 Snowflake NEXUS tables navigated through Knowledge Catalog. Searches semantically, reads metadata, traces lineage, cites glossary terms and data quality.',
        header: 'Chat with Knowledge Catalog Agent',
      },
    };

    const canvas = document.getElementById('vizCanvas');
    const viz = new PointCloud(canvas);
    const chat = new ChatPanel(viz);

    // Event delegation for preset chips so re-renders never drop click handlers
    document.getElementById('presetQuestions').addEventListener('click', (e) => {
      const btn = e.target.closest('.preset-btn');
      if (!btn || !btn.dataset.question) return;
      e.preventDefault();
      chat.sendPreset(btn.dataset.question, activeNarrative);
    });

    function renderLegend() {
      const legend = document.getElementById('vizLegend');
      if (!legend || !_lastConfig) return;
      legend.innerHTML = '';
      const tables = _lastConfig.tables || {};
      const tiers = [
        { key: 'gold', label: 'Gold', color: '#ffd33d' },
        { key: 'silver', label: 'Silver', color: '#a5b4fc' },
        { key: 'bronze', label: 'Bronze', color: '#ff9f43' },
        { key: 'ref', label: 'Other', color: '#8b949e' },
      ];
      for (const t of tiers) {
        const count = (tables[t.key] || []).length;
        const item = document.createElement('div');
        item.className = 'legend-item';
        item.innerHTML = `<div class="legend-dot" style="background:${t.color}"></div> ${t.label} (${count})`;
        legend.appendChild(item);
      }
      if (currentAgentMode === 'kc' && _snowflakeEnabled) {
        const sfItem = document.createElement('div');
        sfItem.className = 'legend-item legend-nexus';
        sfItem.innerHTML = '<div class="legend-diamond" style="background:#00e5ff"></div> NEXUS · Snowflake (External) (' + (_lastConfig.snowflake_tables || []).length + ')';
        legend.appendChild(sfItem);
      }
    }

    function switchNarrative(key) {
      if (key === 'multicloud' && currentAgentMode !== 'kc') return;
      activeNarrative = key;
      viz.setCategory(key);
      chat.setCategory(key);
      document.querySelectorAll('.narrative-tab').forEach(t => t.classList.remove('active'));
      const el = document.querySelector(`[data-narrative="${key}"]`);
      if (el) el.classList.add('active');
      renderPresets();
    }

    function switchAgent(mode) {
      currentAgentMode = mode;
      document.querySelectorAll('.agent-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`[data-agent="${mode}"]`).classList.add('active');

      if (mode !== 'kc' && activeNarrative === 'multicloud') {
        activeNarrative = 'merchandising';
      }

      viz.setMode(mode);
      viz.setCategory(activeNarrative);
      chat.setAgent(mode);
      chat.setCategory(activeNarrative);

      const info = AGENT_INFO[mode];
      document.getElementById('vizTitle').textContent = info.title;
      document.getElementById('vizDesc').textContent = info.desc;
      document.querySelector('#chatHeader > span').textContent = info.header;

      renderNarrativeTabs();
      renderPresets();
      renderLegend();
    }

    function renderNarrativeTabs() {
      const container = document.getElementById('narrativeTabs');
      container.innerHTML = '';
      for (const [key, nar] of Object.entries(NARRATIVES)) {
        if (key === 'multicloud') {
          if (currentAgentMode !== 'kc') continue;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.dataset.narrative = key;
          btn.className = 'narrative-tab cross-cloud-tab' + (key === activeNarrative ? ' active' : '');
          btn.textContent = nar.label;
          btn.title = nar.desc;
          btn.addEventListener('click', () => switchNarrative(key));
          container.appendChild(btn);
          continue;
        }
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'narrative-tab' + (key === activeNarrative ? ' active' : '');
        btn.dataset.narrative = key;
        btn.textContent = nar.label;
        btn.title = nar.desc;
        btn.addEventListener('click', () => switchNarrative(key));
        container.appendChild(btn);
      }
    }

    function renderPresets() {
      const container = document.getElementById('presetQuestions');
      container.innerHTML = '';
      const nar = NARRATIVES[activeNarrative] || NARRATIVES.merchandising;
      for (let i = 0; i < nar.steps.length; i++) {
        const step = nar.steps[i];
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'preset-btn';
        btn.dataset.question = step.q;
        btn.innerHTML = `<span class="preset-num">${i + 1}</span>${step.cat}`;
        btn.title = step.q;
        container.appendChild(btn);
      }
    }

    window.addEventListener('resize', () => viz.resize());
    switchAgent('basic');

    // ---- Auth ----
    let authToken = localStorage.getItem('id_token');
    let oauthClientId = '';

    function handleCredentialResponse(response) {
      authToken = response.credential;
      localStorage.setItem('id_token', authToken);
      const payload = JSON.parse(atob(authToken.split('.')[1]));
      showAuthenticatedUI(payload);
    }
    window.handleCredentialResponse = handleCredentialResponse;

    function showAuthenticatedUI(user) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.querySelector('.main-container').style.display = '';
      document.querySelector('.app-header').style.display = '';
      const profile = document.getElementById('userProfile');
      if (user.picture) {
        document.getElementById('userAvatar').src = user.picture;
        document.getElementById('userAvatar').style.display = '';
      }
      document.getElementById('userName').textContent = user.name || user.email || '';
      profile.classList.remove('hidden');
    }

    function showLoginScreen() {
      document.getElementById('loginScreen').classList.remove('hidden');
      document.querySelector('.main-container').style.display = 'none';
      document.querySelector('.app-header').style.display = 'none';
      if (oauthClientId && typeof google !== 'undefined' && google.accounts) {
        google.accounts.id.initialize({
          client_id: oauthClientId,
          callback: handleCredentialResponse,
        });
        google.accounts.id.renderButton(
          document.getElementById('gsiButtonContainer'),
          { theme: 'filled_black', size: 'large', text: 'signin_with', width: 280 }
        );
      }
    }

    function signOut() {
      localStorage.removeItem('id_token');
      authToken = null;
      document.getElementById('userProfile').classList.add('hidden');
      if (typeof google !== 'undefined' && google.accounts) {
        google.accounts.id.disableAutoSelect();
      }
      showLoginScreen();
    }
    window.signOut = signOut;

    // Single /api/config fetch shared between ChatPanel and auth
    fetch('/api/config').then(r => r.json()).then(cfg => {
      _lastConfig = cfg;
      viz.configure(cfg);
      chat.applyConfig(cfg);
      _snowflakeEnabled = cfg.snowflake_enabled !== false;
      _snowflakeLive = cfg.snowflake_live || false;
      if (cfg.environment) {
        const envBadge = document.getElementById('envBadge');
        envBadge.textContent = cfg.environment.toUpperCase();
        envBadge.className = 'env-badge ' + cfg.environment.toLowerCase();
        envBadge.classList.remove('hidden');
      }
      if (_snowflakeEnabled) {
        AGENT_INFO.kc.desc = '128 BigQuery tables + 6 Snowflake NEXUS tables governed through Knowledge Catalog. Discovers cross-cloud metadata, lineage, and vendor licensing.';
        AGENT_INFO.kc.title = 'Cross-Cloud KC Agent';
        if (document.querySelector('[data-agent="kc"].active')) {
          document.getElementById('vizTitle').textContent = AGENT_INFO.kc.title;
          document.getElementById('vizDesc').textContent = AGENT_INFO.kc.desc;
        }
      }
      renderNarrativeTabs();
      renderPresets();
      renderLegend();

      oauthClientId = cfg.oauth_client_id || '';
      if (!oauthClientId) return;

      if (authToken) {
        try {
          const payload = JSON.parse(atob(authToken.split('.')[1]));
          const exp = payload.exp * 1000;
          if (Date.now() < exp) {
            showAuthenticatedUI(payload);
            return;
          }
        } catch (e) {}
        localStorage.removeItem('id_token');
        authToken = null;
      }
      showLoginScreen();
    });

    // Resize handle drag
    const handle = document.getElementById('resizeHandle');
    const panel = document.getElementById('chatPanel');
    let dragging = false;
    handle.addEventListener('mousedown', (e) => {
      dragging = true;
      handle.classList.add('active');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });
    document.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const newWidth = window.innerWidth - e.clientX;
      const clamped = Math.max(280, Math.min(700, newWidth));
      panel.style.width = clamped + 'px';
      viz.resize();
    });
    document.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      handle.classList.remove('active');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    });
  </script>
</body>
</html>

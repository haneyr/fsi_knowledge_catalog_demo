# Governance pipeline (manual trigger).
# Runs the 15 post-deploy governance scripts (glossary, scans, aspects, lineage, etc.).
# Two triggers use this file: governance-dev (cloud-build-dev SA) and
# governance-prod (cloud-build-prod SA). Takes 30+ minutes; idempotent.

substitutions:
  _ENV: "dev"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s

steps:
  # ── Step 1: Resolve target project + generate config.json ───────────────
  - id: setup
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        TFVARS="env/${_ENV}.tfvars"
        PROJECT_ID=$$(grep -E '^\s*project_id' "$$TFVARS" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
        PROJECT_NUMBER=$$(gcloud projects describe "$$PROJECT_ID" --format='value(projectNumber)')
        ACCOUNT=$$(gcloud config get-value account 2>/dev/null)

        cat > scripts/config.json <<CFGEOF
        {
          "project_id": {"sensitive": false, "type": "string", "value": "$$PROJECT_ID"},
          "project_number": {"sensitive": false, "type": "string", "value": "$$PROJECT_NUMBER"},
          "region": {"sensitive": false, "type": "string", "value": "us-central1"},
          "multi_region": {"sensitive": false, "type": "string", "value": "us"},
          "gcp_account_name": {"sensitive": false, "type": "string", "value": "$$ACCOUNT"}
        }
        CFGEOF
        echo "Config generated for $$PROJECT_ID"

  # ── Step 2: Install Python deps ────────────────────────────────────────
  - id: install-deps
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --quiet \
          google-auth \
          google-cloud-bigquery \
          requests \
          pyyaml

  # ── Step 3: Run post-deploy governance scripts ─────────────────────────
  - id: governance
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        bash post_deploy.sh

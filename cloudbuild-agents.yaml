# Agent deployment pipeline.
# Single trigger: agents-deploy-all (agents/**) → _AGENT=all

substitutions:
  _ENV: "dev"
  _AGENT: "all"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # ── Step 1: Resolve target project + generate config.json ───────────────
  - id: setup
    name: google/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        TFVARS="env/${_ENV}.tfvars"
        PROJECT_ID=$$(grep -E '^\s*project_id' "$$TFVARS" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
        echo "$$PROJECT_ID" > /workspace/project_id.txt
        PROJECT_NUMBER=$$(gcloud projects describe "$$PROJECT_ID" --format='value(projectNumber)')
        ACCOUNT=$$(gcloud config get-value account 2>/dev/null)
        cat > scripts/config.json <<CFGEOF
        {
          "project_id": {"sensitive": false, "type": "string", "value": "$$PROJECT_ID"},
          "project_number": {"sensitive": false, "type": "string", "value": "$$PROJECT_NUMBER"},
          "region": {"sensitive": false, "type": "string", "value": "us-central1"},
          "multi_region": {"sensitive": false, "type": "string", "value": "us"},
          "gcp_account_name": {"sensitive": false, "type": "string", "value": "$$ACCOUNT"}
        }
        CFGEOF
        echo "Target project: $$PROJECT_ID ($$PROJECT_NUMBER)"

  # ── Step 2: Deploy agents + persist IDs ─────────────────────────────────
  # Uses gcloud image (has Python + gcloud). Installs ADK deps inline since
  # pip installs don't persist across Cloud Build steps.
  - id: deploy-agents
    name: google/cloud-sdk:slim
    entrypoint: bash
    env:
      - PERSIST_AGENT_IDS=1
    args:
      - -c
      - |
        set -euo pipefail
        pip install --quiet --break-system-packages \
          "google-adk==2.1.0" \
          google-cloud-aiplatform \
          google-cloud-bigquery \
          google-cloud-bigquery-storage \
          google-auth \
          requests \
          pyyaml \
          pyarrow
        export GOOGLE_CLOUD_PROJECT=$$(cat /workspace/project_id.txt)
        export GOOGLE_CLOUD_LOCATION=us-central1
        # Read Snowflake credentials from Secret Manager (optional — skip if not configured)
        export SNOWFLAKE_ACCOUNT=$$(gcloud secrets versions access latest --secret=snowflake-account --project="$$GOOGLE_CLOUD_PROJECT" 2>/dev/null || true)
        export SNOWFLAKE_AGENT_USER=$$(gcloud secrets versions access latest --secret=snowflake-agent-user --project="$$GOOGLE_CLOUD_PROJECT" 2>/dev/null || true)
        export SNOWFLAKE_AGENT_PASSWORD=$$(gcloud secrets versions access latest --secret=snowflake-agent-password --project="$$GOOGLE_CLOUD_PROJECT" 2>/dev/null || true)
        export SNOWFLAKE_WAREHOUSE=$$(gcloud secrets versions access latest --secret=snowflake-warehouse --project="$$GOOGLE_CLOUD_PROJECT" 2>/dev/null || true)
        export SNOWFLAKE_DATABASE=$$(gcloud secrets versions access latest --secret=snowflake-database --project="$$GOOGLE_CLOUD_PROJECT" 2>/dev/null || true)
        source agents/deploy_agents.sh ${_AGENT}

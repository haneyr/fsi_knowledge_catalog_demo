# Release promotion pipeline.
# Trigger: tag v*.*.* (e.g. v1.2.0) → deploys to PROD.
# Uses cloud-build-prod SA (no dev access).
#
# The first step verifies the tagged commit is on main — prevents deploying
# unreviewed code to prod by tagging a feature branch.
#
# Rollback: re-push an earlier tag (e.g. re-run the v1.1.0 trigger).

substitutions:
  _ENV: "prod"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # ── Step 1: Ancestor safeguard ──────────────────────────────────────────
  # Cloud Build does a shallow checkout of the tag — origin/main is not
  # present. We must fetch it before the merge-base check.
  #
  # Two paths pass:
  #   1. The tagged commit is directly on main (normal release).
  #   2. The tag is a hotfix: based on a prior release tag, and every
  #      commit since that tag is a cherry-pick of a commit on main
  #      (verified via patch-id matching with `git cherry`).
  - id: ancestor-check
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SHA=$$(git rev-parse HEAD)
        git fetch --unshallow origin main 2>/dev/null || git fetch origin main
        git fetch --tags origin

        if git merge-base --is-ancestor "$$SHA" origin/main; then
          echo "Ancestor check passed: $$SHA is on main"
          exit 0
        fi

        BASE_TAG=$$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null) || {
          echo "============================================================"
          echo "RELEASE BLOCKED: $$SHA is not on main and no parent tag found."
          echo "============================================================"
          exit 1
        }

        NOVEL=$$(git cherry origin/main HEAD "$$BASE_TAG" | grep '^+' || true)
        if [ -z "$$NOVEL" ]; then
          echo "Hotfix check passed: all commits since $$BASE_TAG exist on main"
          exit 0
        fi

        echo "============================================================"
        echo "RELEASE BLOCKED: $$SHA is NOT on main."
        echo "These commits have no equivalent on main:"
        echo "$$NOVEL"
        echo "Only commits merged to main can be promoted."
        echo "============================================================"
        exit 1

  # ── Step 2: Resolve target project ──────────────────────────────────────
  - id: resolve-project
    name: google/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        TFVARS="env/${_ENV}.tfvars"
        PROJECT_ID=$$(grep -E '^\s*project_id' "$$TFVARS" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
        echo "$$PROJECT_ID" > /workspace/project_id.txt
        echo "Release → project $$PROJECT_ID (${_ENV})"

  # ── Step 3: Generate config.json ────────────────────────────────────────
  - id: generate-config
    name: google/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        PROJECT_ID=$$(cat /workspace/project_id.txt)
        PROJECT_NUMBER=$$(gcloud projects describe "$$PROJECT_ID" --format='value(projectNumber)')
        ACCOUNT=$$(gcloud config get-value account 2>/dev/null)
        cat > scripts/config.json <<CFGEOF
        {
          "project_id": {"sensitive": false, "type": "string", "value": "$$PROJECT_ID"},
          "project_number": {"sensitive": false, "type": "string", "value": "$$PROJECT_NUMBER"},
          "region": {"sensitive": false, "type": "string", "value": "us-central1"},
          "multi_region": {"sensitive": false, "type": "string", "value": "us"},
          "gcp_account_name": {"sensitive": false, "type": "string", "value": "$$ACCOUNT"}
        }
        CFGEOF

  # ── Step 6: Deploy agents + persist IDs ─────────────────────────────────
  - id: deploy-agents
    name: google/cloud-sdk:slim
    entrypoint: bash
    env:
      - PERSIST_AGENT_IDS=1
    args:
      - -c
      - |
        set -euo pipefail
        pip install --quiet --break-system-packages \
          "google-adk==2.1.0" \
          google-cloud-aiplatform \
          google-cloud-bigquery \
          google-cloud-bigquery-storage \
          google-auth \
          requests \
          pyyaml \
          pyarrow
        export GOOGLE_CLOUD_PROJECT=$$(cat /workspace/project_id.txt)
        export GOOGLE_CLOUD_LOCATION=us-central1
        export SNOWFLAKE_ACCOUNT=$$(gcloud secrets versions access latest --secret=snowflake-account --project="$$GOOGLE_CLOUD_PROJECT" 2>/dev/null || true)
        export SNOWFLAKE_AGENT_USER=$$(gcloud secrets versions access latest --secret=snowflake-agent-user --project="$$GOOGLE_CLOUD_PROJECT" 2>/dev/null || true)
        export SNOWFLAKE_AGENT_PASSWORD=$$(gcloud secrets versions access latest --secret=snowflake-agent-password --project="$$GOOGLE_CLOUD_PROJECT" 2>/dev/null || true)
        export SNOWFLAKE_WAREHOUSE=$$(gcloud secrets versions access latest --secret=snowflake-warehouse --project="$$GOOGLE_CLOUD_PROJECT" 2>/dev/null || true)
        export SNOWFLAKE_DATABASE=$$(gcloud secrets versions access latest --secret=snowflake-database --project="$$GOOGLE_CLOUD_PROJECT" 2>/dev/null || true)
        source agents/deploy_agents.sh

  # ── Step 8: Deploy website ─────────────────────────────────────────────
  - id: deploy-website
    name: google/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        export GOOGLE_CLOUD_PROJECT=$$(cat /workspace/project_id.txt)
        export GOOGLE_CLOUD_LOCATION=us-central1
        export BASIC_AGENT_ID=$$(gcloud secrets versions access latest --secret=basic-agent-id --project="$$GOOGLE_CLOUD_PROJECT")
        export SCALED_AGENT_ID=$$(gcloud secrets versions access latest --secret=scaled-agent-id --project="$$GOOGLE_CLOUD_PROJECT")
        export KC_AGENT_ID=$$(gcloud secrets versions access latest --secret=kc-agent-id --project="$$GOOGLE_CLOUD_PROJECT")
        export OAUTH_CLIENT_ID=$$(gcloud secrets versions access latest --secret=oauth-client-id --project="$$GOOGLE_CLOUD_PROJECT")
        export ENVIRONMENT_LABEL=${_ENV}
        export SNOWFLAKE_ACCOUNT=$$(gcloud secrets versions access latest --secret=snowflake-account --project="$$GOOGLE_CLOUD_PROJECT" 2>/dev/null || true)
        bash website-live/deploy.sh
